# Compile le site et le publie sur GitHub Pages à chaque push sur main.
# Activation (une seule fois) : Settings → Pages → Source : « GitHub Actions ».
name: Déployer sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # Même version de Python que Pyodide dans le navigateur, pour vérifier les exercices.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - run: npm ci

      # Bibliothèques utilisées par les leçons (dans le navigateur, Pyodide les charge lui-même).
      - run: pip install numpy pandas matplotlib pillow flask seaborn

      # Bloque la publication si le contenu n'est plus complet ou correct :
      # traductions FR / EN et couverture du plan du cours, exercices, exemples des leçons.
      - run: npm run check-content
      - run: npm run verify-content
      - run: npm run check-examples

      - run: npm run build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
