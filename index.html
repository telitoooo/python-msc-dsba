<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="PyLab — plateforme d'entraînement Python (FR / EN) : rappels théoriques, éditeur intégré, exécution de Python dans le navigateur et exercices Core / Extra / Stretch." />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <title>PyLab · Python par la pratique</title>
    <script>
      // Applique le thème et la langue avant le rendu pour éviter un flash.
      try {
        const saved = localStorage.getItem("pylab:theme");
        const dark = saved ? saved === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
        if (dark) document.documentElement.classList.add("dark");
        const lang = localStorage.getItem("pylab:lang");
        if (lang === "fr" || lang === "en") document.documentElement.lang = lang;
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
